<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
    <!-- 배경 -->
    <rect width="800" height="700" fill="#f5f5f5"/>
    
    <!-- 계산기 프레임 -->
    <rect x="50" y="50" width="700" height="600" rx="20" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    
    <!-- 디스플레이 영역 -->
    <g>
        <!-- 수식 입력 영역 -->
        <rect x="70" y="70" width="660" height="50" rx="10" fill="#e8e8e8"/>
        <text x="90" y="100" font-family="Arial" font-size="18" fill="#666666">2 + sin(30)</text>
        
        <!-- 결과 표시 영역 -->
        <rect x="70" y="130" width="660" height="50" rx="10" fill="#e8e8e8"/>
        <text x="650" y="165" font-family="Arial" font-size="24" fill="#333333" text-anchor="end">2.5000</text>
    </g>
    
    <!-- 모드 및 테마 전환 버튼 -->
    <g transform="translate(70, 200)">
        <!-- 모드 전환 -->
        <rect x="0" y="0" width="120" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
        <text x="20" y="25" font-family="Arial" font-size="14" fill="#ffffff">일반 모드</text>
        
        <!-- 테마 전환 -->
        <rect x="540" y="0" width="120" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
        <text x="560" y="25" font-family="Arial" font-size="14" fill="#ffffff">다크 모드</text>
    </g>
    
    <!-- 메모리 및 특수 기능 -->
    <g transform="translate(70, 260)">
        <rect x="0" y="0" width="50" height="40" rx="5" fill="#e0e0e0" stroke="#333333"/>
        <text x="15" y="25" font-family="Arial" font-size="14" fill="#333333">MC</text>
        
        <rect x="60" y="0" width="50" height="40" rx="5" fill="#e0e0e0" stroke="#333333"/>
        <text x="75" y="25" font-family="Arial" font-size="14" fill="#333333">MR</text>
        
        <rect x="120" y="0" width="50" height="40" rx="5" fill="#e0e0e0" stroke="#333333"/>
        <text x="135" y="25" font-family="Arial" font-size="14" fill="#333333">M+</text>
        
        <rect x="180" y="0" width="50" height="40" rx="5" fill="#e0e0e0" stroke="#333333"/>
        <text x="195" y="25" font-family="Arial" font-size="14" fill="#333333">M-</text>
    </g>
    
    <!-- 숫자 키패드 -->
    <g transform="translate(70, 320)">
        <!-- 숫자 7-9 -->
        <g>
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">7</text>
        </g>
        <g transform="translate(70, 0)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">8</text>
        </g>
        <g transform="translate(140, 0)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">9</text>
        </g>
        
        <!-- 숫자 4-6 -->
        <g transform="translate(0, 70)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">4</text>
        </g>
        <g transform="translate(70, 70)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">5</text>
        </g>
        <g transform="translate(140, 70)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">6</text>
        </g>
        
        <!-- 숫자 1-3 -->
        <g transform="translate(0, 140)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">1</text>
        </g>
        <g transform="translate(70, 140)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">2</text>
        </g>
        <g transform="translate(140, 140)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">3</text>
        </g>
        
        <!-- 숫자 0 및 소수점 -->
        <g transform="translate(0, 210)">
            <rect x="0" y="0" width="130" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">0</text>
        </g>
        <g transform="translate(140, 210)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ffffff" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#333333">.</text>
        </g>
    </g>
    
    <!-- 연산자 키패드 -->
    <g transform="translate(280, 320)">
        <g>
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ff9500" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#ffffff">÷</text>
        </g>
        <g transform="translate(0, 70)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ff9500" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#ffffff">×</text>
        </g>
        <g transform="translate(0, 140)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ff9500" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#ffffff">-</text>
        </g>
        <g transform="translate(0, 210)">
            <rect x="0" y="0" width="60" height="60" rx="5" fill="#ff9500" stroke="#333333"/>
            <text x="25" y="35" font-family="Arial" font-size="24" fill="#ffffff">+</text>
        </g>
    </g>
    
    <!-- 공학용 함수 키패드 -->
    <g transform="translate(400, 320)">
        <!-- 첫째 줄 -->
        <g>
            <rect x="0" y="0" width="70" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
            <text x="15" y="25" font-family="Arial" font-size="14" fill="#ffffff">sin</text>
        </g>
        <g transform="translate(80, 0)">
            <rect x="0" y="0" width="70" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
            <text x="15" y="25" font-family="Arial" font-size="14" fill="#ffffff">cos</text>
        </g>
        <g transform="translate(160, 0)">
            <rect x="0" y="0" width="70" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
            <text x="15" y="25" font-family="Arial" font-size="14" fill="#ffffff">tan</text>
        </g>
        
        <!-- 둘째 줄 -->
        <g transform="translate(0, 50)">
            <rect x="0" y="0" width="70" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
            <text x="15" y="25" font-family="Arial" font-size="14" fill="#ffffff">log</text>
        </g>
        <g transform="translate(80, 50)">
            <rect x="0" y="0" width="70" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
            <text x="15" y="25" font-family="Arial" font-size="14" fill="#ffffff">ln</text>
        </g>
        <g transform="translate(160, 50)">
            <rect x="0" y="0" width="70" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
            <text x="15" y="25" font-family="Arial" font-size="14" fill="#ffffff">x²</text>
        </g>
        
        <!-- 셋째 줄 -->
        <g transform="translate(0, 100)">
            <rect x="0" y="0" width="70" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
            <text x="15" y="25" font-family="Arial" font-size="14" fill="#ffffff">√</text>
        </g>
        <g transform="translate(80, 100)">
            <rect x="0" y="0" width="70" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
            <text x="15" y="25" font-family="Arial" font-size="14" fill="#ffffff">π</text>
        </g>
        <g transform="translate(160, 100)">
            <rect x="0" y="0" width="70" height="40" rx="5" fill="#4a90e2" stroke="#333333"/>
            <text x="15" y="25" font-family="Arial" font-size="14" fill="#ffffff">e</text>
        </g>
    </g>
    
    <!-- 계산 이력 패널 -->
    <g transform="translate(400, 480)">
        <rect x="0" y="0" width="300" height="150" rx="10" fill="#e8e8e8"/>
        <text x="20" y="30" font-family="Arial" font-size="14" fill="#333333">계산 이력</text>
        <line x1="0" y1="40" x2="300" y2="40" stroke="#333333"/>
        
        <!-- 이력 항목들 -->
        <g transform="translate(20, 60)">
            <text font-family="Arial" font-size="12" fill="#333333">1. 2 + sin(30) = 2.5000</text>
            <text y="25" font-family="Arial" font-size="12" fill="#333333">2. log(100) = 2.0000</text>
            <text y="50" font-family="Arial" font-size="12" fill="#333333">3. 5² = 25.0000</text>
        </g>
    </g>
</svg> 